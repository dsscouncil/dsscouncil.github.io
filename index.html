<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO
         ONE description string, repeated verbatim in og:description,
         twitter:description and manifest.webmanifest. Search engines, WhatsApp,
         X and the installed PWA otherwise each quote a different sentence, which
         is what makes the same link look like a different page everywhere.
         `npm run check:meta` fails if the four ever drift apart again. -->
    <title>DS Secondary Student Council | DS Pulse</title>
    <link rel="icon" type="image/png" href="/favicon-v2.png" />
    <!-- Conventional paths too: crawlers, preview generators and older tools
         request /favicon.ico or /apple-touch-icon.png by convention rather
         than parsing the tags above. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="DS Pulse — the official Secondary Student Council of Dubai Scholars Private School. Proactive Union for Leadership & Student Empowerment." />
    <meta name="keywords" content="Dubai Scholars, Dubai Scholars Private School, Secondary Student Council, DS Student Council, DS Pulse, PULSE, Proactive Union for Leadership and Student Empowerment, student government Dubai, school clubs, student voice" />
    <meta name="author" content="Dubai Scholars Secondary Student Council" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b1622" />
    <link rel="canonical" href="https://www.ds-pulse.com/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, Instagram DMs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dubai Scholars Secondary Student Council" />
    <meta property="og:url" content="https://www.ds-pulse.com/" />
    <meta property="og:title" content="DS Secondary Student Council | DS Pulse" />
    <meta property="og:description" content="DS Pulse — the official Secondary Student Council of Dubai Scholars Private School. Proactive Union for Leadership & Student Empowerment." />
    <meta property="og:image" content="https://www.ds-pulse.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Dubai Scholars Secondary Student Council — DS Pulse" />
    <meta property="og:locale" content="en_AE" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DS Secondary Student Council | DS Pulse" />
    <meta name="twitter:description" content="DS Pulse — the official Secondary Student Council of Dubai Scholars Private School. Proactive Union for Leadership & Student Empowerment." />
    <meta name="twitter:image" content="https://www.ds-pulse.com/og-image.jpg" />

    <!-- Structured data for Google -->

    <!-- One @graph so the two entities resolve against each other in a single
         pass. The WebSite entity is what claims the site name shown above the
         result; without it Google derives one from the domain and renders the
         bare hostname. The name is only honoured once it also appears as real
         text on the page, which is why the footer spells it out. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.ds-pulse.com/#website",
          "url": "https://www.ds-pulse.com/",
          "name": "Dubai Scholars Secondary Student Council",
          "alternateName": "DS Pulse",
          "inLanguage": "en-AE",
          "publisher": { "@id": "https://www.ds-pulse.com/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://www.ds-pulse.com/#organization",
          "name": "Dubai Scholars Secondary Student Council",
          "alternateName": "DS Pulse",
          "url": "https://www.ds-pulse.com/",
          "logo": "https://www.ds-pulse.com/logo.png",
          "slogan": "We Don't Just Represent. We Deliver.",
          "parentOrganization": {
            "@type": "School",
            "name": "Dubai Scholars Private School",
            "url": "https://dubaischolars.com",
            "sameAs": [
              "https://ae.linkedin.com/school/dubai-scholars-private-school/",
              "https://www.instagram.com/dubaischolars1976"
            ]
          },
          "sameAs": [
            "https://www.instagram.com/ds_studentcouncil",
            "https://ae.linkedin.com/school/dubai-scholars-private-school/"
          ]
        }
      ]
    }
    </script>

    <!-- Fonts are bundled locally (see @font-face in src/index.css) instead of
         loaded from Google Fonts. The old external stylesheet was render-blocking
         and added two third-party connections before first paint; the variable
         woff2 files are now emitted into assets/ and discovered as the CSS parses. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
